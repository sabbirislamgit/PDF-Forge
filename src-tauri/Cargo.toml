[package]
name = "pdf-forge"
version = "1.0.0"
description = "Professional Desktop PDF Editor built with Tauri"
authors = ["Sabbir"]
license = "MIT"
repository = "https://github.com/sabbirislamgit/PDF-Forge"
homepage = "https://github.com/sabbirislamgit/PDF-Forge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
